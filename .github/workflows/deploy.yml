name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ملف اختبار عشان نعرف هل الـ FTP استقبل الملفات
      - name: Create Deployment Test File
        run: |
          echo "Deployment successful - $(date)" > deploy-test.txt

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./

          server-dir: domains/alzahraa-construction.com/imperisyachts.com/

          dangerous-clean-slate: false
          security: loose

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
